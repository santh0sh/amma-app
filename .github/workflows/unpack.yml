name: unpack-bundle
# Code updates arrive as bundle.tgz (uploaded through the GitHub web page).
# This job unpacks it into the repo and removes the bundle.
on:
  push:
    paths: ["*bundle*", ".github/workflows/unpack.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          # the web uploader may prefix the name (e.g. 3-bundle.tgz)
          b=$(ls *bundle* 2>/dev/null | head -1)
          test -n "$b" || exit 0
          case "$b" in *.b64) base64 -d "$b" > /tmp/bundle.tgz ;; *) cp "$b" /tmp/bundle.tgz ;; esac
          tar xzf /tmp/bundle.tgz
          git rm -q --cached -- *bundle*; rm -f -- *bundle*
          git config user.name "amma-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Unpack code bundle" || exit 0
          git push
